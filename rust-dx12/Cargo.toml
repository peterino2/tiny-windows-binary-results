[package]
name = "hello-dx12-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
windows = { version = "=0.52.0", features = [
    "Win32_Foundation", "Win32_Graphics_Direct3D", "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common",
    "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
