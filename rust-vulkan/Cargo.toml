[package]
name = "hello-vulkan-rust"
version = "0.1.0"
edition = "2021"
[dependencies]
ash = "=0.37.3"
windows = { version = "=0.52.0", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
